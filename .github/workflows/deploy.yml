name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Check deploy scripts
        run: bash -n deploy/deploy.sh && bash -n deploy/zoe-alarm-deploy
      - name: Build development image
        run: docker build --target dev -t zoe-alarm-dev .
      - name: Install dependencies
        run: docker run --rm -v "$PWD":/app -w /app zoe-alarm-dev composer install --no-interaction --prefer-dist
      - name: Code style
        run: docker run --rm -v "$PWD":/app -w /app zoe-alarm-dev vendor/bin/pint --test
      - name: Tests
        run: docker run --rm -v "$PWD":/app -w /app zoe-alarm-dev vendor/bin/phpunit
      - name: Build production image
        run: docker build --target production -t zoe-alarm .

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Deploy to the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 "root@$HOST" "$GITHUB_SHA"
