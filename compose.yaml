x-app: &app
  build:
    context: .
    target: production
  image: zoe-alarm
  env_file: .env
  volumes:
    - data:/data
    - backups:/backups
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  migrate:
    <<: *app
    command: sh -c "touch /data/database.sqlite && php artisan migrate --force"
    restart: "no"

  # Polls the sources and delivers broadcasts.
  worker:
    <<: *app
    command: php artisan app:worker
    stop_grace_period: 60s
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Sends reminders and service alerts, which must not wait for a broadcast.
  reminders:
    <<: *app
    command: php artisan app:reminders
    stop_grace_period: 60s
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Handles user commands via long polling.
  bot:
    <<: *app
    command: php artisan app:bot
    stop_grace_period: 30s
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  data:
  backups:
